# Root-cause findings (v3.1.0)
finding:
  gc:
    title: "Garbage collection pressure"
    detail: "&7GC time: &f%d ms&7 in the last 60s, longest pause ~&f%.0f ms&7 (%d collections)"
    recommendation: "Check heap size (-Xmx) and GC flags (Aikar flags / ZGC); profile allocations with spark."
  memory:
    title: "Real memory pressure (old gen full after GC)"
    detail: "&7Old generation still at &f%.0f%%&7 after garbage collection (heap max: %d MB)"
    recommendation: "Increase heap or find the memory hog: spark heapsummary, check for leaking plugins."
  plugin:
    title: "Plugin '%s' is consuming measurable tick time"
    detail: "&7Measured: &f%.1f ms/s&7 (%.1f%% of one thread), heaviest event: &f%s&7 (%.1f ms/s)"
    recommendation: "Check the configuration of '%s', update it, or profile it with spark to pinpoint the hot path."
  hotchunk:
    title: "High activity chunk in %s at %d, %d"
    detail: "&7Dominant: &f%s&7 — hoppers: &f%.1f/s&7, redstone: &f%.1f/s&7, spawns: &f%.1f/s"
    recommendation: "Inspect the area (world %s, around x=%d z=%d): hopper clocks, item farms and always-on redstone are typical culprits."
    kind:
      hopper: "hopper item traffic"
      redstone: "redstone/piston activity"
      spawns: "mob spawning"
  chunkgen:
    title: "Heavy chunk generation"
    detail: "&7New chunks are being generated at &f%.1f/s&7 (exploration or world border expansion)"
    recommendation: "Pre-generate the world (e.g. with Chunky) or limit exploration."
  churn:
    title: "Chunk thrashing in %s around %d, %d"
    detail: "&7This chunk was re-loaded &f%d&7 times recently"
    recommendation: "Look for portals, chunk loaders or farms that keep re-loading this area."
  entities:
    title: "Entity hotspot in %s at %d, %d"
    detail: "&7%d entities in one chunk, mostly &f%s&7 (%d)"
    recommendation: "Thin out the farm/crowd; consider hopper minecart redesigns or entity cramming limits."
  worldsave:
    title: "World save / backup in progress"
    detail: "&7World '%s' was saved %d s before this evaluation - saves pause the tick loop briefly"
    recommendation: "Routine saves are harmless. If this fires often or stalls long, check your backup schedule and disk speed."
  stall:
    title: "Server frozen outside the tick loop"
    detail: "&7The main thread was blocked for %.1f s (%d s ago) without a single tick completing - so tick times look healthy while TPS collapsed"
    recommendation: "Typical causes: loading or generating a world (/mv create, world imports), a plugin doing blocking I/O on the main thread, or the host itself stalling. Check the server log for what ran at that moment."
  unknown:
    title: "No clear single cause found"
    detail: "&7The lag source is not among the instrumented causes (GC, plugins, chunk activity, entities)."
    recommendation: "Run 'spark profiler' for a deep sample; the incident data above narrows the time window."

