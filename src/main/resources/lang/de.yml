# Ursachen-Befunde (v3.1.0)
finding:
  gc:
    title: "Garbage-Collection-Druck"
    detail: "&7GC-Zeit: &f%d ms&7 in den letzten 60s, längste Pause ~&f%.0f ms&7 (%d Sammlungen)"
    recommendation: "Heap-Größe (-Xmx) und GC-Flags prüfen (Aikar-Flags / ZGC); Allokationen mit spark profilen."
  memory:
    title: "Echter Speicherdruck (Old-Gen nach GC voll)"
    detail: "&7Old Generation auch nach der Garbage Collection bei &f%.0f%%&7 (Heap-Maximum: %d MB)"
    recommendation: "Heap vergrößern oder den Speicherfresser finden: spark heapsummary, verdächtige Plugins prüfen."
  plugin:
    title: "Plugin '%s' verbraucht messbar Tickzeit"
    detail: "&7Gemessen: &f%.1f ms/s&7 (%.1f%% eines Threads), teuerstes Event: &f%s&7 (%.1f ms/s)"
    recommendation: "Konfiguration von '%s' prüfen, Update einspielen oder mit spark den heißen Pfad eingrenzen."
  hotchunk:
    title: "Hochaktiver Chunk in %s bei %d, %d"
    detail: "&7Dominant: &f%s&7 — Hopper: &f%.1f/s&7, Redstone: &f%.1f/s&7, Spawns: &f%.1f/s"
    recommendation: "Bereich prüfen (Welt %s, um x=%d z=%d): Hopper-Uhren, Item-Farmen und Dauer-Redstone sind typische Verursacher."
    kind:
      hopper: "Hopper-Item-Verkehr"
      redstone: "Redstone-/Piston-Aktivität"
      spawns: "Mob-Spawning"
  chunkgen:
    title: "Starke Chunk-Generierung"
    detail: "&7Neue Chunks werden mit &f%.1f/s&7 generiert (Erkundung oder Weltrand-Erweiterung)"
    recommendation: "Welt vorgenerieren (z. B. mit Chunky) oder Erkundung begrenzen."
  churn:
    title: "Chunk-Dauerladen in %s um %d, %d"
    detail: "&7Dieser Chunk wurde kürzlich &f%d&7-mal neu geladen"
    recommendation: "Nach Portalen, Chunk-Loadern oder Farmen suchen, die den Bereich immer wieder laden."
  entities:
    title: "Entity-Hotspot in %s bei %d, %d"
    detail: "&7%d Entities in einem Chunk, überwiegend &f%s&7 (%d)"
    recommendation: "Farm/Ansammlung ausdünnen; ggf. Entity-Cramming-Limits oder Farm-Redesign."
  worldsave:
    title: "Weltspeicherung / Backup läuft"
    detail: "&7Welt '%s' wurde %d s vor dieser Auswertung gespeichert - Speichern pausiert die Tick-Schleife kurz"
    recommendation: "Routine-Speicherungen sind harmlos. Falls das häufig auftritt oder lange dauert: Backup-Zeitplan und Festplattengeschwindigkeit prüfen."
  stall:
    title: "Server stand still außerhalb der Tick-Schleife"
    detail: "&7Der Hauptthread war %.1f s blockiert (vor %d s), ohne dass ein einziger Tick fertig wurde - deshalb sehen die Tickzeiten gesund aus, während die TPS einbrachen"
    recommendation: "Typische Ursachen: Laden oder Generieren einer Welt (/mv create, Welt-Importe), ein Plugin mit blockierendem I/O im Hauptthread, oder der Host selbst hängt. Im Server-Log nachsehen, was zu diesem Zeitpunkt lief."
  unknown:
    title: "Keine eindeutige Einzelursache gefunden"
    detail: "&7Die Lag-Quelle liegt nicht bei den instrumentierten Ursachen (GC, Plugins, Chunk-Aktivität, Entities)."
    recommendation: "'spark profiler' für ein Tiefen-Sampling starten; die Incident-Daten oben grenzen das Zeitfenster ein."

