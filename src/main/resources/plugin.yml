name: PerformanceAnalyzer
version: 3.2.1
main: dev.boondock.performanceanalyzer.PerformanceAnalyzer
api-version: '1.21'
author: BoondockSulfur
folia-supported: true
softdepend:
  - ProtocolLib
  - spark

commands:
  perfstatus:
    description: Shows live server performance data.
    usage: /perfstatus
    permission: performance.status
  perfhistory:
    description: Shows aggregated performance data (last hour).
    usage: /perfhistory [minutes]
    permission: performance.history
  perfgui:
    description: Opens the performance GUI.
    usage: /perfgui
    permission: performance.gui
  perfreload:
    description: Reloads the plugin configuration.
    usage: /perfreload
    permission: performance.admin
  worldstats:
    description: Shows per-world statistics.
    usage: /worldstats [worldname]
    permission: performance.admin
    aliases: [ws]
  entitystats:
    description: Shows entity analysis.
    usage: /entitystats [worldname|hotspots]
    permission: performance.admin
    aliases: [es]
  chunkstats:
    description: Shows chunk statistics.
    usage: /chunkstats [problems|frequent|clear]
    permission: performance.admin
    aliases: [cs]
  perfincidents:
    description: Shows recent performance incidents with causes and severity.
    usage: /perfincidents [number|clear]
    permission: performance.admin
    aliases: [pi, perfdrops, incidents]
  perfsilent:
    description: Toggle alert notifications (streamer mode).
    usage: /perfsilent [all|performance|list]
    permission: performance.admin
    aliases: [ps, silent]
  perfcalibrate:
    description: Proposes threshold values derived from this server's own measurements.
    usage: /perfcalibrate [apply|revert]
    permission: performance.admin
    aliases: [pc, calibrate]

permissions:
  performance.status:
    description: Allows viewing the live status.
    default: true
  performance.history:
    description: Allows viewing the history graph/stats.
    default: op
  performance.gui:
    description: Allows opening the performance GUI.
    default: op
  performance.alerts:
    description: Receives performance incident alerts.
    default: op
  performance.admin:
    description: Admin tasks (reload, debug, etc.).
    default: op
