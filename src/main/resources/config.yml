# PerformanceAnalyzer Configuration
# Plugin for monitoring and analyzing server performance

# Internal: config schema version used for automatic migration. Do not edit.
config_version: 7

# Language Setting
# Available: en (English), de (German)
language: en

# Database Configuration
database:
  # Database type: 'sqlite' or 'mysql'
  type: sqlite

  # SQLite settings (only relevant when type: sqlite)
  sqlite_file: "plugins/PerformanceAnalyzer/perf.db"

  # MySQL settings (only relevant when type: mysql)
  host: localhost
  port: 3306
  name: performance
  user: perfuser
  password: ""

  # Connection Pool Settings (HikariCP)
  pool:
    max_pool_size: 10
    minimum_idle: 2
    connection_timeout_ms: 10000

  # Automatic cleanup: how many days of data to keep in the database
  retention_days: 30

  # Fallback file logging when the database is unavailable
  fallback_file_logging: true
  fallback_log_file: "plugins/PerformanceAnalyzer/fallback.log"

# Performance Monitoring Settings
performance:
  # How often should metrics be written to the database? (in seconds)
  log_interval_seconds: 60

  # Grace period after server start (seconds) during which no incidents or
  # alerts are raised - boot ticks are always slow and would otherwise
  # trigger a false EMERGENCY on every start. Metrics are still collected.
  startup_grace_seconds: 60

  # Enable profiling (for future Spark integration)
  enable_profiling: true

  # Packet analysis via ProtocolLib (requires ProtocolLib plugin)
  packet_analysis: true

  # Debug mode: Enables detailed console output
  # Only enable for troubleshooting, otherwise logs become too verbose
  debug_mode: false

# Lag Analysis Settings (v2.0.0+)
lag_analysis:
  # Enable player activity tracking
  # Tracks block interactions, movements, commands, etc.
  # PERFORMANCE: Uses sampling (only every 10th movement)
  # Can be disabled on servers with extremely many players
  player_tracking: true

  # Enable plugin performance analysis
  # Identifies plugins with many event listeners and tasks
  # Has minimal performance impact
  plugin_analysis: true

  # Timeout for chunk analysis in milliseconds
  # Prevents chunk analysis from taking too long with many chunks
  # Recommended: 5000ms (5 seconds)
  chunk_analysis_timeout_ms: 5000

  # ====== Thresholds for Problematic Chunks ======
  # When is a chunk considered "problematic"?
  # Adjust these values to your server hardware!

  # Tile Entities per Chunk (hoppers, furnaces, chests, etc.)
  # Warning: Too many block entities cause lag
  # Standard: 10 | Powerful servers: 20-30 | Weak servers: 5-8
  chunk_tile_entities_threshold: 10

  # Redstone components per chunk (estimated)
  # Warning: Lots of redstone = many block updates
  # Standard: 30 | Powerful servers: 50-100 | Weak servers: 15-20
  chunk_redstone_threshold: 30

  # Entities per Chunk (animals, monsters, items, etc.)
  # WARNING level: From this number, chunk is marked as "Warning"
  # Standard: 50 | Powerful servers: 80-100 | Weak servers: 30-40
  chunk_entity_warning: 50

  # Entities per Chunk - CRITICAL level
  # CRITICAL level: From this number, chunk is marked as "Critical"
  # Standard: 100 | Powerful servers: 150-200 | Weak servers: 60-80
  chunk_entity_critical: 100

  # ====== Thresholds for World Health ======
  # When is an entire world considered problematic?

  # Total Entities per World - WARNING
  # Standard: 5000 | Large servers: 10000+ | Small servers: 2000-3000
  world_entity_warning: 5000

  # Total Entities per World - CRITICAL
  # Standard: 10000 | Large servers: 20000+ | Small servers: 5000-7000
  world_entity_critical: 10000

  # ====== Plugin Risk Score Interpretation ======
  # At what risk score is a plugin considered suspicious?
  # Risk Score = (Event Listeners * 2) + (Scheduled Tasks * 3)
  # For "Heavy Plugins" the score is multiplied by 2

  # Low-Risk Plugin (green in reports)
  # Standard: 0-50
  plugin_risk_low: 50

  # Medium-Risk Plugin (yellow in reports)
  # Standard: 51-100
  plugin_risk_medium: 100

  # High-Risk Plugin (red in reports)
  # Standard: 101+
  # (Everything above plugin_risk_medium is considered high)

# Warning Thresholds
#
# v3.1.0: fixed MSPT/TPS thresholds are gone. Severity is derived from the
# real tick-work time against the 50 ms deadline plus the server's own
# learned baseline (a server that normally runs at 5 ms alerts far earlier
# than one that normally runs at 30 ms).
thresholds:
  # Single-tick spike threshold (milliseconds of real tick work).
  # One tick above this value triggers immediate incident analysis.
  spike_tick_ms: 100.0

  # Packet flood threshold (packets per tick)
  # Standard: 1000 (may indicate DDoS or lag machine)
  # Set to 0 to disable
  packet_flood_per_tick: 1000.0

# Discord Webhook for Notifications
discord:
  # Enable Discord notifications
  enabled: false

  # Discord Webhook URL
  # Create a webhook in your Discord channel: Server Settings → Integrations → Webhooks
  webhook_url: ""

  # Which alerts should be sent to Discord?
  alert_types:
    incident_opened: true
    incident_escalated: true
    incident_resolved: true
    packet_flood: true
    performance: true

# Alert Preferences (Streamer/Silent Mode)
alerts:
  # Players who have muted alerts (persistent across restarts)
  # Format: "uuid" (all muted) or "uuid:PERFORMANCE" (specific types)
  # Managed via /perfsilent command - do not edit manually
  silent_players: []

# GUI Settings
gui:
  # Automatically refresh open GUI pages
  auto_refresh: true

# REST API for external monitoring (Grafana, Uptime-Kuma, custom dashboards)
#
# Endpoints (all GET):
#   /api/health              - liveness probe (no authentication)
#   /api/metrics             - tick/GC/severity/baseline/plugin/activity snapshot
#   /api/incidents           - active + recent incidents with findings
#   /api/worlds              - cached per-world stats + hot chunks
#   /api/metrics/prometheus  - Prometheus text format for Grafana scraping
#
# Authentication: every endpoint except /api/health requires the header
#   Authorization: Bearer <key>
# The API refuses to start while 'key' is empty or "changeme".
#
# Example: curl -H "Authorization: Bearer <key>" http://127.0.0.1:8080/api/metrics
api:
  # Enable the HTTP server
  enabled: false

  # Bind address. Default 127.0.0.1 = reachable from this machine only
  # (safe default). Only set 0.0.0.0 if the API sits behind a
  # TLS-terminating reverse proxy (nginx/caddy) - the API itself speaks
  # plain HTTP and the bearer key would otherwise cross the network
  # unencrypted.
  bind: "127.0.0.1"

  # TCP port
  port: 8080

  # API key for the Authorization: Bearer header.
  # Generate a strong random one, e.g.:  openssl rand -hex 32
  key: ""
